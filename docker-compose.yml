services:
  postgres:
    image: postgres:16-alpine
    container_name: vybe-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: vybe
      POSTGRES_PASSWORD: vybe
      POSTGRES_DB: vybe
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vybe -d vybe"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
